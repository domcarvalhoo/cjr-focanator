<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focanator</title>

    <style>
        button {
	        background-color: rgb(255, 233, 63);
        }
        body {
            background-color: #c9faff;
            text-align: center;
        }
    </style>
</head>
<body>
    <script>
        function resposta() {
            var escolha = Math.floor(Math.random() * 10);

            if (escolha%2)
                alert("O focanator escolheu "+document.querySelector(".input1").value)
            else
                alert("O focanator escolheu "+document.querySelector(".input2").value)
        }
    </script>
    <h1>Focanator</h1>
    <h2>Pergunte à foca</h2>
    <img height=380px src="focanator.jpg" alt="Imagem nao encontrada."> 
    <div>
        <input type="text" class="input1"> ou <input type="text" class="input2">
    </div>
    <button type="button" onclick="resposta()"> Perguntar </button>
</body>
</html>
